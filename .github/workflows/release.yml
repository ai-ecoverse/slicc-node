name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: ai-ecoverse/slicc-shared-web/.github/workflows/node-release.yml@v1.12.0
    with:
      chromium: false
    secrets: inherit
